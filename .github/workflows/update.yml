name: Update sing-box Core

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 检查 sing-box 核心与项目更新
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ---- sing-box 核心版本 (官方源, 取最新 unstable/prerelease) ----
          RELEASES=$(curl -sL https://api.github.com/repos/SagerNet/sing-box/releases)
          RELEASE_JSON=$(echo "$RELEASES" | jq '[.[] | select(.prerelease==true)][0]')
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          VERSION=$(echo "$TAG" | sed 's/^v//')
          CURRENT=$(grep '^version=' module.prop | sed 's/^version=//')

          echo "当前版本: $CURRENT"
          echo "最新版本: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          CORE_UPDATED=false
          [ "$CURRENT" != "$VERSION" ] && CORE_UPDATED=true
          echo "core_updated=$CORE_UPDATED" >> "$GITHUB_OUTPUT"

          # ---- 项目文件是否有更新（自上次 release 以来） ----
          # 排除工作流自身维护的文件和无关文件，防止工作流自己的提交再次触发构建:
          # .github/  module.prop  update.json  changelog.md  README  LICENSE  .gitignore
          PROJECT_UPDATED=false
          LAST_TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            HEAD_SHA=$(git rev-parse HEAD)
            if CHANGED=$(gh api "repos/$GITHUB_REPOSITORY/compare/$LAST_TAG...$HEAD_SHA" --jq '.files[].filename' 2>/dev/null); then
              CHANGED=$(echo "$CHANGED" | grep -vE '^(\.github/|module\.prop|update\.json|changelog\.md|README|LICENSE|\.gitignore)' || true)
              if [ -n "$CHANGED" ]; then
                PROJECT_UPDATED=true
                echo "项目文件变更:"
                echo "$CHANGED"
              fi
            else
              # compare API 失败（如 tag 被强制推送重写）: 保守起见视为有更新
              PROJECT_UPDATED=true
            fi
          else
            # 还没有任何 release, 需要构建
            PROJECT_UPDATED=true
          fi
          echo "project_updated=$PROJECT_UPDATED" >> "$GITHUB_OUTPUT"

          if [ "$CORE_UPDATED" != "true" ] && [ "$PROJECT_UPDATED" != "true" ]; then
            echo "sing-box 核心无新版且项目无变更, 跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("sing-box-.*-android-arm64\\.tar\\.gz$")) | .browser_download_url')
          ASSET_NAME=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("sing-box-.*-android-arm64\\.tar\\.gz$")) | .name')
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: 下载 sing-box 核心 (arm64)
        # bin/ 被 .gitignore 忽略, checkout 里没有, 每次构建都必须重新下载
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p bin
          # 删除旧 tar.gz
          rm -f bin/sing-box-*.tar.gz
          # 下载核心
          curl -sL -o "bin/${{ steps.check.outputs.asset_name }}" "${{ steps.check.outputs.asset_url }}"
          echo "已下载: ${{ steps.check.outputs.asset_name }}"

      - name: 计算 versionCode
        if: steps.check.outputs.skip != 'true'
        id: versioncode
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          LAST_NUM=$(echo "$VERSION" | grep -oE '[0-9]+$')
          COMPUTED=$((MAJOR * 10000 + MINOR * 100 + LAST_NUM))
          PREV=$(grep '^versionCode=' module.prop | sed 's/^versionCode=//')
          PREV=${PREV:-0}
          # 保证单调递增: 取 核心计算值 与 上一次 versionCode + 1 的较大者,
          # 纯项目更新时 versionCode 只 +1, 核心版本回退(如 beta 转 stable)也不倒退
          if [ "$COMPUTED" -le "$PREV" ]; then
            VERSION_CODE=$((PREV + 1))
          else
            VERSION_CODE=$COMPUTED
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: 更新 module.prop
        if: steps.check.outputs.skip != 'true'
        run: |
          sed -i "s/^version=.*/version=${{ steps.check.outputs.version }}/" module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ steps.versioncode.outputs.version_code }}/" module.prop

      - name: 更新 update.json
        if: steps.check.outputs.skip != 'true'
        run: |
          REPO="${{ github.repository }}"
          VERSION="${{ steps.check.outputs.version }}"
          VCODE="${{ steps.versioncode.outputs.version_code }}"
          TAG="${{ steps.check.outputs.tag }}"
          if [ "${{ steps.check.outputs.core_updated }}" = "true" ]; then
            # 核心更新: tag 用 v{version}
            REL_TAG="v${VERSION}"
          else
            # 纯项目更新: tag 用 v{version}-r{versionCode}, 避免与已有 v{version} 冲突
            REL_TAG="v${VERSION}-r${VCODE}"
          fi
          # 生成可读的 changelog.md, 供 Manager 更新弹窗显示。
          # 不能直接指 GitHub release 页面 (HTML), 否则弹窗里会显示成一堆代码。
          {
            echo "## sing-box 核心更新至 ${VERSION}"
            echo ""
            curl -sL "https://api.github.com/repos/SagerNet/sing-box/releases/tags/${TAG}" | jq -r '.body'
            echo ""
            echo "> 发布页: https://github.com/SagerNet/sing-box/releases/tag/${TAG}"
          } > changelog.md
          printf '{\n  "version": "v%s",\n  "versionCode": %s,\n  "zipUrl": "https://github.com/%s/releases/download/%s/sing-box-init-v%s.zip",\n  "changelog": "https://raw.githubusercontent.com/%s/main/changelog.md"\n}\n' \
            "$VERSION" "$VCODE" "$REPO" "$REL_TAG" "$VERSION" "$REPO" > update.json

      - name: 缓存 Zig 编译器
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: $HOME/zig
          key: zig-0.17.0-dev.1662+cc6f42302

      - name: 安装 Zig (多镜像源 + 重试, 避免单个镜像抖动)
        # 不用 setup-zig action: 它随机选镜像, 某个镜像故障时整个安装失败;
        # 这里手动多源 fallback (实测官方源与多个社区镜像都可用) + curl 重试,
        # 并用 actions/cache 缓存解压后的编译器, 后续构建零下载。
        if: steps.check.outputs.skip != 'true'
        run: |
          ZIG_VER=0.17.0-dev.1662+cc6f42302
          ZIG_DIR=$HOME/zig
          if [ -x "$ZIG_DIR/zig" ] && [ "$("$ZIG_DIR/zig" version)" = "$ZIG_VER" ]; then
            echo "命中缓存: $("$ZIG_DIR/zig" version)"
          else
            ZIG_TAR=zig-x86_64-linux-${ZIG_VER}.tar.xz
            rm -rf "$ZIG_DIR" && mkdir -p "$ZIG_DIR"
            # 依次尝试多个镜像源 (官方源优先), 每个源 curl 自带 3 次重试
            for base in \
              https://ziglang.org/builds \
              https://ziglang.freetls.fastly.net \
              https://pkg.hexops.org/zig \
              https://zig.linus.dev/zig \
              https://zig.chainsafe.dev; do
              echo "尝试下载: $base/$ZIG_TAR"
              if curl -fsSL --retry 3 --retry-all-errors -o "/tmp/$ZIG_TAR" "$base/$ZIG_TAR" 2>/dev/null; then
                echo "下载成功: $base"
                break
              fi
            done
            [ -s "/tmp/$ZIG_TAR" ] || { echo "错误: 所有镜像源都下载失败"; exit 1; }
            tar -xJf "/tmp/$ZIG_TAR" -C "$ZIG_DIR" --strip-components=1
            rm -f "/tmp/$ZIG_TAR"
          fi
          echo "$ZIG_DIR" >> "$GITHUB_PATH"

      - name: 构建模块 zip
        if: steps.check.outputs.skip != 'true'
        run: |
          sh build.sh

      - name: 创建 GitHub Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          VCODE="${{ steps.versioncode.outputs.version_code }}"
          SING_BOX_TAG="${{ steps.check.outputs.tag }}"
          ZIP="sing-box-init-v${VERSION}.zip"
          if [ "${{ steps.check.outputs.core_updated }}" = "true" ]; then
            REL_TAG="v${VERSION}"
            TITLE="v${VERSION}"
            NOTES="sing-box 核心更新至 ${SING_BOX_TAG}"
          else
            REL_TAG="v${VERSION}-r${VCODE}"
            TITLE="v${VERSION} (build ${VCODE})"
            NOTES="模块脚本/配置更新（sing-box 核心未变, ${SING_BOX_TAG}）"
          fi
          gh release create "$REL_TAG" "$ZIP" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"

      - name: 提交版本更新
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.prop update.json changelog.md
          if [ "${{ steps.check.outputs.core_updated }}" = "true" ]; then
            git commit -m "chore: 更新 sing-box 核心至 ${{ steps.check.outputs.version }}" || true
          else
            git commit -m "chore: 模块更新（核心未变, build ${{ steps.versioncode.outputs.version_code }}）" || true
          fi
          git push
